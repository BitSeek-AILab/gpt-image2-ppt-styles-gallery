.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:20px 0 0;flex-wrap:wrap}
.pager button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;

    <div class="filters">
      <button class="sw on" data-x="*"><span><i style=background:#999></i><i style=background:#999></i><i style=background:#999></i><i style=background:#999></i></span><b>全部色系</b></button>
      <button class="sw" data-x="低饱和莫兰迪"><span><i style=background:#C9BEB0></i><i style=background:#A9A093></i><i style=background:#D8D0C4></i><i style=background:#8F8577></i></span><b>低饱和莫兰迪</b></button><button class="sw" data-x="暖色系"><span><i style=background:#C97B4A></i><i style=background:#A85A32></i><i style=background:#E0A969></i><i style=background:#7A3F22></i></span><b>暖色系</b></button><button class="sw" data-x="浅灰白"><span><i style=background:#F2F1EE></i><i style=background:#DEDCD6></i><i style=background:#C6C3BC></i><i style=background:#FAF9F7></i></span><b>浅灰白</b></button><button class="sw" data-x="暗色暖调"><span><i style=background:#2B211A></i><i style=background:#4A3626></i><i style=background:#6B4C33></i><i style=background:#8A6A45></i></span><b>暗色暖调</b></button><button class="sw" data-x="多色撞色"><span><i style=background:#E0452F></i><i style=background:#2F7FE0></i><i style=background:#F2C230></i><i style=background:#3FA05A></i></span><b>多色撞色</b></button><button class="sw" data-x="黑白灰"><span><i style=background:#111111></i><i style=background:#444444></i><i style=background:#888888></i><i style=background:#DDDDDD></i></span><b>黑白灰</b></button><button class="sw" data-x="暗色冷调"><span><i style=background:#151A22></i><i style=background:#243040></i><i style=background:#33465C></i><i style=background:#4A6480></i></span><b>暗色冷调</b></button><button class="sw" data-x="冷色系"><span><i style=background:#2F6FA8></i><i style=background:#4E9BC4></i><i style=background:#7FC0DC></i><i style=background:#B8DCEA></i></span><b>冷色系</b></button><button class="sw" data-x="黄绿系"><span><i style=background:#8FA83C></i><i style=background:#B7C766></i><i style=background:#5E7A2E></i><i style=background:#D6DFA0></i></span><b>黄绿系</b></button><button class="sw" data-x="其他"><span><i style=background:#9A938A></i><i style=background:#B8B2A8></i><i style=background:#6E6A62></i><i style=background:#D5D0C8></i></span><b>其他</b></button>
    </div>
    <div class="filters">
      <label class="tog"><input type="checkbox" id="fFace"> 隐藏含真人</label>
      <label class="tog"><input type="checkbox" id="fAnime"> 只看动漫/卡通</label>
      <input type="search" id="q" placeholder="搜索标题 / 来源…">
      <span id="stat" style="font-size:12.5px;color:var(--mut)"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="pager" id="pager"></div>
  </section>
</main>
<footer>
  提示词与图片版权归各自原作者。本页仅作内部研究与风格参考：图片直接引用原站 CDN、未再分发副本，每条保留出处链接。
  如原作者要求下架请告知。
</footer>
<div id="detail"><div class="dwrap" id="dwrap"></div></div>
<script>
const DATA='data/';
const PER=48;
let META=null,SCEN=null,CLU=null,TXT=null;
let S='',C=null,X='*',Q='',PAGE=0,IDS=[],CACHE={},TXCACHE={};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadScript(src){return new Promise((r,j)=>{const s=document.createElement('script');s.src=src;s.onload=()=>r();s.onerror=()=>j();document.head.appendChild(s);});}
function pad(n){return String(n).padStart(2,'0');}

async function boot(){
  await loadScript(DATA+'meta.js'); META=window.__META__;
  await loadScript(DATA+'scen.js'); SCEN=window.__SCEN__;
}
async function ensureClu(id){
  if(CACHE[id]) return;
  await loadScript(DATA+'c'+pad(id)+'.js'); CACHE[id]=window.__CLU__||[];
}
async function ensureTxt(id){
  if(TXCACHE[id]) return;
  await loadScript(DATA+'t'+pad(id)+'.js'); TXCACHE[id]=window.__TXT__||{};
}
function crumbs(){
  const p=[];
  p.push('<button data-go="1">← 重选用途</button>');
  const sn=(META.scenarios.find(x=>x.id===S)||{}).name||'';
  p.push('<span>用途：<b>'+esc(sn)+'</b></span>');
  if(C!==null){p.push('<button data-go="2">← 重选主题</button>');
    p.push('<span>主题：<b>簇'+C+'</b></span>');}
  $('crumb').innerHTML=p.join(' · ');
  $('crumb').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
}
function go(step){
  $('s1').style.display=step===1?'':'none';
  $('s2').style.display=step===2?'':'none';
  $('s3').style.display=step===3?'':'none';
  if(step===1){C=null;}
  crumbs();
  if(step===3) render();
  scrollTo(0,0);
}
async function pickScenario(sid){
  S=sid; C=null;
  // scope the topic tiles to this scenario: reuse cluster membership and filter
  IDS=new Set(SCEN[sid]||[]);
  go(2);
}
async function pickCluster(cid){
  C=cid; await ensureClu(cid);
  document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('on',+t.dataset.c===cid));
  go(3);
}
function render(){
  if(C===null) return;
  const inScen=IDS, rows=CACHE[C]||[];
  const q=Q.trim().toLowerCase();
  const hideFace=$('fFace').checked, onlyAnime=$('fAnime').checked;
  const out=rows.filter(r=>{
    if(inScen && !inScen.has(r.h)) return false;
    if(X!=='*' && r.c!==X) return false;
    if(hideFace && r.f===1) return false;
    if(onlyAnime && r.k!==2) return false;
    if(q && !((r.t+' '+r.s).toLowerCase().includes(q))) return false;
    return true;
  });
  const pages=Math.max(1,Math.ceil(out.length/PER));
  if(PAGE>=pages) PAGE=pages-1;
  const slice=out.slice(PAGE*PER,PAGE*PER+PER);
  $('grid').innerHTML=slice.map(r=>
    '<div class="card" data-h="'+esc(r.h)+'"><img loading="lazy" referrerpolicy="no-referrer" src="'+esc(r.i)+'" alt="">'
    +'<div class="cap"><b>'+esc(r.s)+'</b>'+esc(r.t)+'</div></div>').join('')
    || '<p class="empty">这个组合下没有条目。试试换色系、取消勾选，或回到上一步换个主题。</p>';
  $('grid').querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.h));
  $('stat').textContent='命中 '+out.length.toLocaleString()+' 条';
  $('pager').innerHTML=pags(pages,out.length);
  const pv=$('pv'),nx=$('nx');
  if(pv)pv.onclick=()=>{PAGE--;render();scrollTo(0,0);};
  if(nx)nx.onclick=()=>{PAGE++;render();scrollTo(0,0);scrollTo(0,0);};
  // prefetch the prompt text for the visible page so the detail view opens instantly
  ensureTxt(C);
}
function pags(pages,total){
  return '<button id="pv" '+(PAGE===0?'disabled':'')+'>‹ 上一页</button>'
   +'<span style="font-size:12.5px;color:#6d675e">第 '+(PAGE+1)+' / '+pages+' 页 · 共 '+total.toLocaleString()+' 条</span>'
   +'<button id="nx" '+(PAGE>=pages-1?'disabled':'')+'>下一页 ›</button>';
}
async function openDetail(h){
  if(C!==null) await ensureTxt(C);
  const txt=(TXCACHE[C]||{})[h]||'';
  const r=(CACHE[C]||[]).find(x=>x.h===h)||{};
  const imgs=(CACHE[C]||[]).find(x=>x.h===h)?.i?[r.i]:[];
  $('dwrap').innerHTML='<div><button class="close" onclick="closeDetail()">关闭</button>'
   +imgs.map(u=>'<img referrerpolicy="no-referrer" src="'+esc(u)+'" alt="">').join('')
   +'<div class="dmeta">来源 <b>'+esc(r.s)+'</b></div></div>'
   +'<div><h3>'+esc(r.t||'(无标题)')+'</h3>'
   +(r.u?'<div class="dmeta"><a href="'+esc(r.u)+'" target="_blank" rel="noopener noreferrer">查看原出处</a></div>':'')
   +'<pre>'+esc(txt||'(正文未找到)')+'</pre></div>';
  $('detail').classList.add('on');
}
function closeDetail(){$('detail').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
document.querySelectorAll('.scen button').forEach(b=>b.onclick=()=>pickScenario(b.dataset.s));
document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>pickCluster(+b.dataset.c));
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); X=b.dataset.x; PAGE=0; render();
});
$('q').addEventListener('input',e=>{Q=e.target.value;clearTimeout(window._t);
  window._t=setTimeout(()=>{PAGE=0;render();},200);});
$('fFace').addEventListener('change',()=>{PAGE=0;render();});
$('fAnime').addEventListener('change',()=>{PAGE=0;render();});
(async()=>{await boot();})();
</script></body></html>
